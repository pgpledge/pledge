# Postgres 18 with pledge installed, plus one-shot jobs against it.
#
#   docker compose up -d db                       # server on localhost:${PLEDGE_PORT:-5432}
#   docker compose run --rm check                 # smoke test: install, transfer, verify()
#   docker compose run --rm bench                 # pgbench: pledge vs pgledger -> bench/results/
#   docker compose run --rm test                  # cargo pgrx test + clippy + fmt (builder image)
#
# PG_MAJOR picks the server version for all of them (only 18 is wired up for now).
x-pg: &pg
  image: pledge:pg${PG_MAJOR:-18}
  environment:
    PGHOST: db
    PGUSER: pledge
    PGPASSWORD: pledge
    PGDATABASE: pledge

services:
  db:
    <<: *pg
    build:
      context: .
      target: runtime
      args: { PG_MAJOR: "${PG_MAJOR:-18}" }
    environment:
      POSTGRES_USER: pledge
      POSTGRES_PASSWORD: pledge
    # bench-friendly: same knob pgledger's compose sets, plus pg_stat_statements for digging in
    command: postgres -c max_wal_size=2GB -c shared_preload_libraries=pg_stat_statements
    ports: ["${PLEDGE_PORT:-5432}:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pledge"]
      interval: 2s
      timeout: 5s
      retries: 30

  check:
    <<: *pg
    profiles: [jobs]
    depends_on: { db: { condition: service_healthy } }
    volumes: ["./tests/smoke.sql:/smoke.sql:ro"]
    command: psql -X -v ON_ERROR_STOP=1 -f /smoke.sql

  bench:
    <<: *pg
    profiles: [jobs]
    depends_on: { db: { condition: service_healthy } }
    volumes:
      - ./bench:/bench
      - ./plans/reference/pgledger:/pgledger:ro
    environment:
      PGHOST: db
      PGUSER: pledge
      PGPASSWORD: pledge
      PGLEDGER_DIR: /pgledger
      # empty = take the PROFILE default (see bench/run.sh)
      PROFILE: ${PROFILE:-standard}
      ACCOUNTS: ${ACCOUNTS:-}
      CLIENTS: ${CLIENTS:-}
      THREADS: ${THREADS:-}
      DURATION: ${DURATION:-}
      RUNS: ${RUNS:-}
      SCENARIOS: ${SCENARIOS:-}
      TARGETS: ${TARGETS:-}
    command: /bench/run.sh

  # validation suite (tests/validation): bank test, model-based property test, Berka replay
  validate:
    <<: *pg
    image: pledge-validate
    profiles: [jobs]
    build:
      context: tests/validation
      dockerfile_inline: |
        FROM python:3.13-slim
        RUN pip install --no-cache-dir "psycopg[binary]==3.2.*"
    depends_on: { db: { condition: service_healthy } }
    volumes: ["./tests/validation:/v"]
    working_dir: /v
    environment:
      PGHOST: db
      PGUSER: pledge
      PGPASSWORD: pledge
      PGDATABASE: postgres
    command: python -u run_all.py

  # the exchange example from python/example on http://localhost:8000 (admin: admin / admin)
  example:
    image: pledge-example
    profiles: [example]
    build:
      context: python
      dockerfile_inline: |
        FROM python:3.13-slim
        RUN apt-get update && apt-get install -y --no-install-recommends libpq5 \
            && rm -rf /var/lib/apt/lists/*
        COPY --from=ghcr.io/astral-sh/uv:0.13.5 /uv /usr/local/bin/uv
        ENV UV_PROJECT_ENVIRONMENT=/venv PATH=/venv/bin:$$PATH
        WORKDIR /app
        COPY pyproject.toml uv.lock README.md ./
        COPY src src
        RUN uv sync --locked --no-dev
        COPY example example
    depends_on: { db: { condition: service_healthy } }
    environment:
      PLEDGE_DSN: host=db port=5432 user=pledge password=pledge dbname=exchange
      DJANGO_SUPERUSER_USERNAME: admin
      DJANGO_SUPERUSER_PASSWORD: admin
      DJANGO_SUPERUSER_EMAIL: admin@example.com
    ports: ["${EXAMPLE_PORT:-8000}:8000"]
    command: sh example/docker-start.sh

  test:
    image: pledge-test:pg${PG_MAJOR:-18}
    profiles: [jobs]
    build:
      context: .
      target: test
      args: { PG_MAJOR: "${PG_MAJOR:-18}" }
